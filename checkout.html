<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Urban Rich</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="urbanlogo.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="urbanlogo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <style>
    .chk-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
    }
    @media (max-width: 800px) {
      .chk-grid { grid-template-columns: 1fr; }
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border-dark); background: var(--bg); font-family: inherit; font-size: 14px; border-radius: 2px; }
    .form-control:focus { outline: none; border-color: var(--black); }
    .payment-option-single {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border: 1.5px solid var(--black);
      border-radius: 6px;
      background: var(--bg-secondary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    .pay-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="Urban Rich Logo" class="logo-img" style="height:38px;width:auto;object-fit:contain;" />
      <span class="logo-wordmark">Urban Rich</span>
    </a>
    <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);">🔒 SECURE CHECKOUT</div>
  </nav>
</header>

<main class="section">
  <div class="container chk-grid">
    <!-- SHIPPING & BILLING DETAILS -->
    <div>
      <h2 style="font-family:var(--font-heading);font-size:1.6rem;font-weight:700;margin-bottom:24px;text-transform:uppercase;">SHIPPING ADDRESS</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="custName" class="form-control" required placeholder="e.g. Rahul Sharma">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label>Phone Number (WhatsApp) *</label>
            <input type="tel" id="custPhone" class="form-control" required placeholder="e.g. 9876543210">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="custEmail" class="form-control" placeholder="rahul@example.com">
          </div>
        </div>
        <div class="form-group">
          <label>Complete Street Address *</label>
          <input type="text" id="custAddress" class="form-control" required placeholder="Flat / House no, Building name, Street">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="form-group">
            <label>City *</label>
            <input type="text" id="custCity" class="form-control" required placeholder="Bijapur">
          </div>
          <div class="form-group">
            <label>State *</label>
            <input type="text" id="custState" class="form-control" required placeholder="Karnataka">
          </div>
          <div class="form-group">
            <label>Pincode *</label>
            <input type="text" id="custPincode" class="form-control" required placeholder="586101">
          </div>
        </div>

        <h2 style="font-family:var(--font-heading);font-size:1.4rem;font-weight:700;margin:32px 0 16px 0;text-transform:uppercase;">PAYMENT METHOD</h2>
        <div class="payment-option-single">
          <div class="pay-icon-badge">⚡</div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:800;font-size:14.5px;">Instant Online Payment</span>
              <span style="background:#10b981;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:0.5px;">FAST & SECURE</span>
            </div>
            <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">
              UPI (GPay / PhonePe / Paytm), Cards, Netbanking & Wallets via Cashfree
            </div>
          </div>
        </div>

        <button type="submit" id="submitOrderBtn" style="width:100%;margin-top:20px;padding:16px;background:var(--black);color:#fff;border:none;font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:background 0.2s ease;">
          PROCEED TO SECURE PAYMENT →
        </button>
      </form>
    </div>

    <!-- ORDER SUMMARY COLUMN -->
    <div style="background:var(--bg-secondary);padding:28px;border-radius:4px;height:fit-content;border:1px solid var(--border);">
      <h3 style="font-family:var(--font-heading);font-size:1.2rem;font-weight:700;margin-bottom:14px;text-transform:uppercase;">SUMMARY</h3>
      
      <!-- DYNAMIC COUPON BANNER & INPUT (MANAGED VIA ADMIN PANEL) -->
      <div id="checkoutCouponBannerContainer" style="margin-bottom: 14px;"></div>

      <div id="checkoutSummaryList"></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;">
        <span>Total Payable</span>
        <span id="chkTotal">₹0.00</span>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0;">
      <span class="footer-copy">© 2026 Urban Rich. All rights reserved.</span>
    </div>
  </div>
</footer>

<script>
  function renderCheckoutSummary() {
    const totals = window.UR_CART.calculateTotals();
    document.getElementById('chkTotal').textContent = `₹${totals.total.toFixed(2)}`;

    const submitBtn = document.getElementById('submitOrderBtn');
    if (submitBtn && !submitBtn.disabled) {
      submitBtn.textContent = `PROCEED TO SECURE PAYMENT (₹${totals.total.toFixed(2)}) →`;
    }

    const list = document.getElementById('checkoutSummaryList');
    const cart = window.UR_CART.get();
    let discountRowHtml = '';
    if (totals.discount > 0 && totals.couponCode) {
      const isPct = (totals.discountType === 'PERCENTAGE');
      const tag = isPct ? `${totals.discountValue}% OFF` : `₹${totals.discountValue} OFF`;
      discountRowHtml = `
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:#10b981;font-weight:700;">
          <span>Coupon (${totals.couponCode} — ${tag})</span>
          <span>-₹${totals.discount.toFixed(2)}</span>
        </div>
      `;
    }

    list.innerHTML = cart.map(item => `
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;">
        <span>${item.name} (${item.size}) x${item.quantity}</span>
        <span style="font-weight:700;">₹${(item.price * item.quantity).toFixed(2)}</span>
      </div>
    `).join('') + discountRowHtml + `
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:10px;color:var(--text-muted);">
        <span>Shipping Fee</span>
        <span>${totals.shippingFee === 0 ? 'FREE (₹0)' : '₹' + totals.shippingFee.toFixed(2)}</span>
      </div>
    `;

    renderCheckoutCouponBanner();
  }

  let activeCheckoutCoupon = null;

  async function renderCheckoutCouponBanner() {
    const container = document.getElementById('checkoutCouponBannerContainer');
    if (!container || !window.UR_COUPON) return;

    try {
      const coupon = await window.UR_COUPON.fetchProductBannerCoupon();
      const applied = window.UR_COUPON.get();

      if (!coupon || !coupon.is_active || !coupon.show_product_banner) {
        if (!applied) {
          container.innerHTML = '';
          activeCheckoutCoupon = null;
          return;
        }
      }

      const activeObj = applied || coupon;
      activeCheckoutCoupon = activeObj;

      const isPct = (activeObj.discount_type === 'PERCENTAGE');
      const discountStr = isPct ? `${parseFloat(activeObj.discount_value)}% OFF` : `₹${parseFloat(activeObj.discount_value).toFixed(0)} FLAT OFF`;
      const isApplied = window.UR_COUPON.isApplied(activeObj.code);

      container.innerHTML = `
        <div class="rakhi-coupon-banner ${isApplied ? 'applied' : ''}" id="checkoutCouponBanner" onclick="toggleCheckoutCoupon('${activeObj.code}')">
          <div class="rakhi-banner-left">
            <span class="rakhi-badge">${activeObj.banner_tag || '✨ SPECIAL EVENT OFFER'}</span>
            <div class="rakhi-title">Get <strong>${discountStr}</strong> on your order!</div>
            <div class="rakhi-sub">Use coupon code <span class="rakhi-code">${activeObj.code}</span></div>
          </div>
          <button type="button" class="rakhi-apply-btn" onclick="event.stopPropagation(); toggleCheckoutCoupon('${activeObj.code}');">
            ${isApplied ? '✓ APPLIED' : 'APPLY'}
          </button>
        </div>
      `;
    } catch (e) {
      container.innerHTML = '';
    }
  }

  async function toggleCheckoutCoupon(code) {
    if (!window.UR_COUPON) return;
    const isApplied = window.UR_COUPON.isApplied(code);
    if (isApplied) {
      window.UR_COUPON.remove();
    } else {
      await window.UR_COUPON.apply(code);
    }
    renderCheckoutSummary();
  }

  function resetCheckoutButton() {
    const submitBtn = document.getElementById('submitOrderBtn');
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>PROCEED TO SECURE ONLINE PAYMENT →</span>`;
    }
  }

  function prefillCheckoutForm() {
    try {
      const raw = sessionStorage.getItem('ur_last_order');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.customer_name && !document.getElementById('custName').value) document.getElementById('custName').value = parsed.customer_name;
        if (parsed.customer_email && !document.getElementById('custEmail').value) document.getElementById('custEmail').value = parsed.customer_email;
        if (parsed.customer_phone && !document.getElementById('custPhone').value) document.getElementById('custPhone').value = parsed.customer_phone;
        if (parsed.shipping_address) {
          const addr = parsed.shipping_address;
          if (typeof addr === 'object') {
            if (addr.address && !document.getElementById('custAddress').value) document.getElementById('custAddress').value = addr.address;
            if (addr.city && !document.getElementById('custCity').value) document.getElementById('custCity').value = addr.city;
            if (addr.state && !document.getElementById('custState').value) document.getElementById('custState').value = addr.state;
            if (addr.pincode && !document.getElementById('custPincode').value) document.getElementById('custPincode').value = addr.pincode;
          }
        }
      }
    } catch(e) {}
  }

  window.addEventListener('pageshow', function() {
    resetCheckoutButton();
    renderCheckoutSummary();
  });

  window.addEventListener('focus', function() {
    resetCheckoutButton();
  });

  document.addEventListener('DOMContentLoaded', function() {
    // If cart is empty, redirect back to cart
    if (window.UR_CART && window.UR_CART.get().length === 0) {
      window.location.href = 'cart.html';
      return;
    }

    prefillCheckoutForm();
    renderCheckoutSummary();
    resetCheckoutButton();
    document.addEventListener('urSupabaseReady', renderCheckoutSummary);

    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'INITIALIZING SECURE CHECKOUT...';

      const totals = window.UR_CART.calculateTotals();
      const orderNum = 'UR-' + Math.floor(100000 + Math.random() * 900000);
      const cart = window.UR_CART.get();
      const orderData = {
        order_number: orderNum,
        customer_name: document.getElementById('custName').value.trim(),
        customer_email: document.getElementById('custEmail').value.trim(),
        customer_phone: document.getElementById('custPhone').value.trim(),
        shipping_address: {
          address: document.getElementById('custAddress').value.trim(),
          city: document.getElementById('custCity').value.trim(),
          state: document.getElementById('custState').value.trim(),
          pincode: document.getElementById('custPincode').value.trim()
        },
        subtotal: totals.subtotal,
        discount_amount: totals.discount || 0,
        shipping_fee: totals.shippingFee,
        total_amount: totals.total,
        payment_status: 'PENDING',
        order_status: 'PLACED'
      };

      // Store in session and device localStorage for personal order tracking
      sessionStorage.setItem('ur_last_order', JSON.stringify({ ...orderData, items: cart, payment_method: 'ONLINE' }));
      try {
        let myOrders = JSON.parse(localStorage.getItem('ur_my_orders') || '[]');
        if (!myOrders.includes(orderNum)) {
          myOrders.unshift(orderNum);
          localStorage.setItem('ur_my_orders', JSON.stringify(myOrders));
        }
        localStorage.setItem('ur_user_phone', orderData.customer_phone);
        localStorage.setItem('ur_user_email', orderData.customer_email);
        localStorage.setItem('ur_user_name', orderData.customer_name);
      } catch(e) {}

      const client = window.urSupabase || (window.supabase && typeof window.supabase.createClient === 'function' ? window.supabase.createClient(window.UR_CONFIG.SUPABASE_URL, window.UR_CONFIG.SUPABASE_ANON_KEY) : null);
      if (client) {
        try {
          // Check if authenticated user
          try {
            const { data: sessionData } = await client.auth.getSession();
            if (sessionData?.session?.user) {
              orderData.user_id = sessionData.session.user.id;
            }
          } catch(authErr) {}

          const { data: insertedOrder, error: orderErr } = await client.from('orders').insert([orderData]).select().single();
          if (orderErr) console.error('Order insert error:', orderErr);
          if (insertedOrder && cart.length > 0) {
            const itemsToInsert = cart.map(item => ({
              order_id: insertedOrder.id,
              product_name: item.name,
              variant_size: item.size || 'M',
              unit_price: parseFloat(item.price || 0),
              quantity: parseInt(item.quantity || 1),
              total_price: parseFloat(item.price || 0) * parseInt(item.quantity || 1),
              image_url: item.image || ''
            }));
            const { error: itemsErr } = await client.from('order_items').insert(itemsToInsert);
            if (itemsErr) console.error('Order items insert error:', itemsErr);
          }
        } catch(err) {
          console.error('Order creation exception:', err);
        }
      }

      // Dispatch push notification to Admin for new pending checkout attempt
      fetch('/api/send-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: '⏳ PAYMENT PENDING - NEW CHECKOUT',
          message: `Order #${orderNum} (₹${totals.total}) started by ${orderData.customer_name} (${orderData.customer_phone}) — awaiting payment.`,
          event_type: 'PAYMENT_PENDING',
          order_id: orderNum,
          amount: totals.total
        })
      }).catch(e => console.log('Pending push dispatch bypass:', e));

      // Do NOT clear cart yet! Cart is preserved until payment is confirmed on order-success.html
      window.location.href = `payment.html?order_id=${orderNum}&amount=${totals.total}`;
    });
  });
</script>
</body>
</html>
