<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Urban Rich</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="urbanlogo.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="urbanlogo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <style>
    .chk-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
    }
    @media (max-width: 800px) {
      .chk-grid { grid-template-columns: 1fr; }
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border-dark); background: var(--bg); font-family: inherit; font-size: 14px; border-radius: 2px; }
    .form-control:focus { outline: none; border-color: var(--black); }
    .payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      margin-bottom: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="Urban Rich Logo" class="logo-img" style="height:38px;width:auto;object-fit:contain;" />
      <span class="logo-wordmark">Urban Rich</span>
    </a>
    <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);">🔒 SECURE CHECKOUT</div>
  </nav>
</header>

<main class="section">
  <div class="container chk-grid">
    <!-- SHIPPING & BILLING DETAILS -->
    <div>
      <h2 style="font-family:var(--font-heading);font-size:1.6rem;font-weight:700;margin-bottom:24px;text-transform:uppercase;">SHIPPING ADDRESS</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="custName" class="form-control" required placeholder="e.g. Rahul Sharma">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label>Phone Number (WhatsApp) *</label>
            <input type="tel" id="custPhone" class="form-control" required placeholder="e.g. 9876543210">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="custEmail" class="form-control" placeholder="rahul@example.com">
          </div>
        </div>
        <div class="form-group">
          <label>Complete Street Address *</label>
          <input type="text" id="custAddress" class="form-control" required placeholder="Flat / House no, Building name, Street">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="form-group">
            <label>City *</label>
            <input type="text" id="custCity" class="form-control" required placeholder="Bijapur">
          </div>
          <div class="form-group">
            <label>State *</label>
            <input type="text" id="custState" class="form-control" required placeholder="Karnataka">
          </div>
          <div class="form-group">
            <label>Pincode *</label>
            <input type="text" id="custPincode" class="form-control" required placeholder="586101">
          </div>
        </div>

        <h2 style="font-family:var(--font-heading);font-size:1.4rem;font-weight:700;margin:32px 0 16px 0;text-transform:uppercase;">PAYMENT METHOD</h2>
        <div class="payment-option" style="border-color:var(--black);background:var(--bg-secondary);" onclick="selectPayment('ONLINE', this)">
          <input type="radio" name="payMethod" value="ONLINE" checked>
          <div>
            <div style="font-weight:700;font-size:14px;">Instant Online Payment (UPI / Cards / Netbanking)</div>
            <div style="font-size:12px;color:var(--text-muted);">Secure Instant Payment via Cashfree Gateway</div>
          </div>
        </div>
        <div class="payment-option" onclick="selectPayment('COD', this)">
          <input type="radio" name="payMethod" value="COD">
          <div>
            <div style="font-weight:700;font-size:14px;">Cash on Delivery (COD)</div>
            <div style="font-size:12px;color:var(--text-muted);">Pay upon package delivery</div>
          </div>
        </div>

        <button type="submit" id="submitOrderBtn" style="width:100%;margin-top:24px;padding:16px;background:var(--black);color:#fff;border:none;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">PLACE ORDER NOW →</button>
      </form>
    </div>

    <!-- ORDER SUMMARY COLUMN -->
    <div style="background:var(--bg-secondary);padding:28px;border-radius:4px;height:fit-content;border:1px solid var(--border);">
      <h3 style="font-family:var(--font-heading);font-size:1.2rem;font-weight:700;margin-bottom:20px;text-transform:uppercase;">SUMMARY</h3>
      <div id="checkoutSummaryList"></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;">
        <span>Total Payable</span>
        <span id="chkTotal">₹0</span>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0;">
      <span class="footer-copy">© 2026 Urban Rich. All rights reserved.</span>
    </div>
  </div>
</footer>

<script>
  let selectedPayMethod = 'ONLINE';

  function selectPayment(method, el) {
    selectedPayMethod = method;
    document.querySelectorAll('.payment-option').forEach(opt => {
      opt.style.borderColor = 'var(--border-dark)';
      opt.style.background = 'var(--bg)';
    });
    el.style.borderColor = 'var(--black)';
    el.style.background = 'var(--bg-secondary)';
    el.querySelector('input').checked = true;
  }

  function renderCheckoutSummary() {
    const totals = window.UR_CART.calculateTotals();
    document.getElementById('chkTotal').textContent = `₹${totals.total.toFixed(2)}`;

    const list = document.getElementById('checkoutSummaryList');
    const cart = window.UR_CART.get();
    list.innerHTML = cart.map(item => `
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;">
        <span>${item.name} (${item.size}) x${item.quantity}</span>
        <span style="font-weight:700;">₹${item.price * item.quantity}</span>
      </div>
    `).join('') + `
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:12px;color:var(--text-muted);">
        <span>Shipping Fee</span>
        <span>${totals.shippingFee === 0 ? 'FREE (₹0)' : '₹' + totals.shippingFee.toFixed(2)}</span>
      </div>
    `;
  }

  document.addEventListener('DOMContentLoaded', function() {
    renderCheckoutSummary();
    document.addEventListener('urSupabaseReady', renderCheckoutSummary);

    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitOrderBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'PROCESSING ORDER...';

      const totals = window.UR_CART.calculateTotals();
      const orderNum = 'UR-' + Math.floor(100000 + Math.random() * 900000);
      const cart = window.UR_CART.get();
      const orderData = {
        order_number: orderNum,
        customer_name: document.getElementById('custName').value,
        customer_email: document.getElementById('custEmail').value,
        customer_phone: document.getElementById('custPhone').value,
        shipping_address: {
          address: document.getElementById('custAddress').value,
          city: document.getElementById('custCity').value,
          state: document.getElementById('custState').value,
          pincode: document.getElementById('custPincode').value
        },
        subtotal: totals.subtotal,
        shipping_fee: totals.shippingFee,
        total_amount: totals.total,
        payment_status: selectedPayMethod === 'ONLINE' ? 'PENDING' : 'PAID',
        order_status: 'PLACED'
      };

      // Store in session for instantaneous receipt rendering
      sessionStorage.setItem('ur_last_order', JSON.stringify({ ...orderData, items: cart, payment_method: selectedPayMethod }));

      const client = window.urSupabase || (window.supabase && typeof window.supabase.createClient === 'function' ? window.supabase.createClient(window.UR_CONFIG.SUPABASE_URL, window.UR_CONFIG.SUPABASE_ANON_KEY) : null);
      if (client) {
        try {
          const { data: insertedOrder, error: orderErr } = await client.from('orders').insert([orderData]).select().single();
          if (orderErr) console.error('Order insert error:', orderErr);
          if (insertedOrder && cart.length > 0) {
            const itemsToInsert = cart.map(item => ({
              order_id: insertedOrder.id,
              product_name: item.name,
              variant_size: item.size || 'M',
              unit_price: parseFloat(item.price || 0),
              quantity: parseInt(item.quantity || 1),
              total_price: parseFloat(item.price || 0) * parseInt(item.quantity || 1),
              image_url: item.image || ''
            }));
            const { error: itemsErr } = await client.from('order_items').insert(itemsToInsert);
            if (itemsErr) console.error('Order items insert error:', itemsErr);
          }
        } catch(e) {
          console.error('Order creation exception:', e);
        }
      }

      if (selectedPayMethod === 'ONLINE') {
        // For Online payments, push notification is sent AFTER payment succeeds on order-success.html
        window.location.href = `payment.html?order_id=${orderNum}&amount=${totals.total}`;
      } else {
        // For COD, the order is complete now -> dispatch notification to admin immediately
        try {
          fetch('/api/send-push', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: '🚨 NEW COD ORDER PLACED!',
              message: `Order #${orderNum} placed for ₹${totals.total} by ${orderData.customer_name} (Cash on Delivery)`,
              order_id: orderNum,
              amount: totals.total
            })
          }).catch(err => console.log('Push notification background bypass:', err));
        } catch(err) {
          console.error('Push error:', err);
        }

        window.UR_CART.set([]);
        window.location.href = `order-success.html?order_id=${orderNum}&method=cod`;
      }
    });
  });
</script>
</body>
</html>
