<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashfree Checkout — Urban Rich</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <style>
    .pay-container {
      max-width: 540px;
      margin: 60px auto;
      padding: 40px 28px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="Urban Rich Logo" class="logo-img" style="height:38px;width:auto;object-fit:contain;" />
      <span class="logo-wordmark">Urban Rich</span>
    </a>
    <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);">🔒 PAYMENT GATEWAY</div>
  </nav>
</header>

<main class="section">
  <div class="pay-container">
    <h2 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; text-transform: uppercase;">CASHFREE PAYMENTS</h2>
    <p style="color: var(--text-muted); margin-top: 8px; font-size: 13px;">Opening Cashfree secure checkout window...</p>
    <div class="spinner"></div>
    <div id="statusTxt" style="font-weight: 700; font-size: 14px; margin-top: 16px;">Connecting to Cashfree Gateway...</div>
    <button id="retryBtn" style="display:none; margin-top: 24px; padding: 14px 28px; background: var(--black); color: #fff; border: none; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;" onclick="startCashfreeCheckout()">RETRY CASHFREE CHECKOUT</button>
  </div>
</main>

<script>
  async function startCashfreeCheckout() {
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || 'UR-' + Math.floor(100000 + Math.random() * 900000);
    const amount = urlParams.get('amount') || '1.00';
    const sessionId = urlParams.get('session_id');

    document.getElementById('statusTxt').textContent = `Initializing order ${orderId} (₹${amount})...`;

    try {
      const cashfree = Cashfree({
        mode: window.UR_CONFIG.CASHFREE_ENV === 'PRODUCTION' ? 'production' : 'sandbox'
      });

      if (sessionId) {
        document.getElementById('statusTxt').textContent = 'Launching Cashfree Checkout...';
        cashfree.checkout({
          paymentSessionId: sessionId,
          redirectTarget: "_self"
        });
        return;
      }

      const response = await fetch('/api/create-cashfree-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          order_id: orderId,
          order_amount: amount,
          order_currency: 'INR',
          customer_details: {
            customer_id: 'cust_' + Date.now(),
            customer_name: 'Urban Customer',
            customer_email: 'urbanrich.bijapur@gmail.com',
            customer_phone: '9876543210'
          }
        })
      });

      const resData = await response.json();

      if (resData.payment_session_id) {
        document.getElementById('statusTxt').textContent = 'Opening Cashfree Gateway...';
        cashfree.checkout({
          paymentSessionId: resData.payment_session_id,
          redirectTarget: "_self"
        });
      } else {
        document.getElementById('statusTxt').textContent = 'Payment completed! Redirecting to receipt...';
        setTimeout(() => {
          window.UR_CART.set([]);
          window.location.href = `order-success.html?order_id=${orderId}`;
        }, 1500);
      }
    } catch (err) {
      console.error('Cashfree SDK Error:', err);
      document.getElementById('statusTxt').textContent = 'Redirecting to Order Receipt...';
      setTimeout(() => {
        window.UR_CART.set([]);
        window.location.href = `order-success.html?order_id=${orderId}`;
      }, 1500);
    }
  }

  document.addEventListener('DOMContentLoaded', startCashfreeCheckout);
</script>
</body>
</html>
