<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashfree Checkout — Urban Rich</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="urbanlogo.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="urbanlogo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <style>
    .pay-container {
      max-width: 520px;
      margin: 60px auto;
      padding: 36px 28px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-cancel-pay {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: transparent;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-cancel-pay:hover {
      color: #d90429;
      border-color: #d90429;
      background: #fff5f5;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="siteHeader">
  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="Urban Rich Logo" class="logo-img" style="height:38px;width:auto;object-fit:contain;" />
      <span class="logo-wordmark">Urban Rich</span>
    </a>
    <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);">🔒 PAYMENT GATEWAY</div>
  </nav>
</header>

<main class="section">
  <div class="pay-container">
    <div style="font-size:32px; margin-bottom: 8px;">⚡</div>
    <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; text-transform: uppercase;">CASHFREE PAYMENTS</h2>
    <p style="color: var(--text-muted); margin-top: 6px; font-size: 13px;">Connecting to Cashfree UPI / Cards / Netbanking gateway...</p>
    
    <div class="spinner" id="paySpinner"></div>
    <div id="statusTxt" style="font-weight: 700; font-size: 14px; margin-top: 14px; color: #222;">Initializing order...</div>
    
    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <button id="retryBtn" style="display:none; padding: 12px 24px; background: var(--black); color: #fff; border: none; font-weight: 700; font-size: 12.5px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 4px;" onclick="startCashfreeCheckout()">RETRY CASHFREE CHECKOUT</button>
      <button type="button" class="btn-cancel-pay" onclick="cancelAndReturn()">✕ CANCEL PAYMENT &amp; RETURN TO CART</button>
    </div>
  </div>
</main>

<script>
  let currentOrderId = '';

  async function cancelAndReturn() {
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = currentOrderId || urlParams.get('order_id');
    if (orderId) {
      window.location.href = `order-success.html?order_id=${encodeURIComponent(orderId)}&status=CANCELLED`;
    } else {
      window.location.href = 'cart.html';
    }
  }

  async function startCashfreeCheckout() {
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || 'UR-' + Math.floor(100000 + Math.random() * 900000);
    const amount = urlParams.get('amount') || '1.00';
    const sessionId = urlParams.get('session_id');
    currentOrderId = orderId;

    document.getElementById('statusTxt').textContent = `Setting up order #${orderId} (₹${amount})...`;
    document.getElementById('retryBtn').style.display = 'none';

    // Retrieve cached customer details from session
    let customer = {
      customer_id: 'cust_' + Date.now(),
      customer_name: 'Urban Customer',
      customer_email: 'support@urbanrichshop.com',
      customer_phone: '9876543210'
    };

    try {
      const raw = sessionStorage.getItem('ur_last_order');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.customer_name) customer.customer_name = parsed.customer_name;
        if (parsed.customer_email) customer.customer_email = parsed.customer_email;
        if (parsed.customer_phone) customer.customer_phone = parsed.customer_phone;
      }
    } catch (e) {}

    try {
      const isProd = window.UR_CONFIG && window.UR_CONFIG.CASHFREE_ENV === 'PRODUCTION';
      const cashfree = Cashfree({
        mode: isProd ? 'production' : 'sandbox'
      });

      if (sessionId) {
        document.getElementById('statusTxt').textContent = 'Launching Cashfree Checkout...';
        cashfree.checkout({
          paymentSessionId: sessionId,
          redirectTarget: "_self"
        });
        return;
      }

      const response = await fetch('/api/create-cashfree-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          order_id: orderId,
          order_amount: amount,
          order_currency: 'INR',
          customer_details: customer
        })
      });

      const resData = await response.json();

      if (resData && resData.payment_session_id) {
        document.getElementById('statusTxt').textContent = 'Opening Cashfree Gateway...';
        cashfree.checkout({
          paymentSessionId: resData.payment_session_id,
          redirectTarget: "_self"
        });
      } else {
        console.warn('Cashfree order response:', resData);
        document.getElementById('statusTxt').textContent = 'Unable to launch gateway automatically.';
        document.getElementById('retryBtn').style.display = 'block';
      }
    } catch (err) {
      console.error('Cashfree SDK Error:', err);
      document.getElementById('statusTxt').textContent = 'Error connecting to payment gateway.';
      document.getElementById('retryBtn').style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', startCashfreeCheckout);
</script>
</body>
</html>
